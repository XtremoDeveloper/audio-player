<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url(background.jpg);
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .glass-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            z-index: 10;
            overflow: hidden;
            text-align: center;
        }
        
        .glass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            transform: skewX(-15deg);
            transition: 0.5s;
            pointer-events: none;
        }
        
        .glass-container:hover::before {
            left: 120%;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Asegúrate de que la ruta de la imagen sea correcta */
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('background.gif');
            background-size: cover;
            background-position: center;
        }
        
        .glass-container h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-shadow: 2px 4px 0 rgba(0, 0, 0, 0.2);
        }
        
        #carpeta-audio {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            outline: none;
            border-radius: 35px;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            margin-bottom: 25px;
            cursor: pointer;
        }
        
        #carpeta-audio::file-selector-button {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.3s ease;
        }
        
        #carpeta-audio::file-selector-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        #carpeta-audio:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        #audio {
            width: 100%;
            margin: 15px 0;
            border-radius: 35px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        #titulo-audio {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            min-height: 40px;
            margin: 15px 0 25px;
            word-break: break-word;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            outline: none;
            border-radius: 35px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin: 8px 0;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #aleatorio {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.4) 0%, rgba(245, 87, 108, 0.4) 100%);
        }
        
        .marca-agua {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            font-weight: 300;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <h1>Reproductor de Audio</h1>
        <input type="file" id="carpeta-audio" webkitdirectory directory multiple>
        <audio id="audio" controls></audio>
        <p id="titulo-audio"></p>
        <button id="aleatorio">Reproducción Aleatoria Automática</button>
        <button id="anterior">Anterior</button>
        <button id="siguiente">Siguiente</button>
        <span class="marca-agua">Xtremo Developer®</span>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const carpetaAudio = document.getElementById('carpeta-audio');
        const tituloAudio = document.getElementById('titulo-audio');
        const aleatorioButton = document.getElementById('aleatorio');
        const anteriorButton = document.getElementById('anterior');
        const siguienteButton = document.getElementById('siguiente');

        let archivos = [];
        let indiceActual = 0;
        let aleatorioActivo = false;

        let historial = [];
        let historialIndex = -1;
        let retrocesoUsado = false;

        carpetaAudio.addEventListener('change', (e) => {
            archivos = Array.from(e.target.files).filter(file =>
                file.type === 'audio/mpeg' ||
                file.type === 'audio/mp4' ||
                file.type === 'audio/x-m4a' ||
                file.name.toLowerCase().endsWith('.mp3') ||
                file.name.toLowerCase().endsWith('.m4a')
            );

            historial = [];
            historialIndex = -1;
            indiceActual = 0;
            retrocesoUsado = false;

            if (archivos.length > 0) {
                reproducirArchivo(indiceActual);
            }
        });

        aleatorioButton.addEventListener('click', () => {
            aleatorioActivo = !aleatorioActivo;
            retrocesoUsado = false;

            if (aleatorioActivo) {
                aleatorioButton.textContent = 'Desactivar Reproducción Aleatoria Automática';

                // Cambiar inmediatamente a canción aleatoria
                if (archivos.length > 0) {
                    reproducirAleatorio();
                }

            } else {
                aleatorioButton.textContent = 'Reproducción Aleatoria Automática';
            }
        });

        anteriorButton.addEventListener('click', () => {
            if (archivos.length === 0) return;

            if (aleatorioActivo) {

                if (!retrocesoUsado && historialIndex > 0) {
                    historialIndex--;
                    indiceActual = historial[historialIndex];
                    reproducirArchivo(indiceActual, false);
                    retrocesoUsado = true;
                } else {
                    reproducirAleatorio();
                    retrocesoUsado = false;
                }

            } else {
                indiceActual = (indiceActual - 1 + archivos.length) % archivos.length;
                reproducirArchivo(indiceActual);
            }
        });

        siguienteButton.addEventListener('click', () => {
            if (archivos.length === 0) return;

            retrocesoUsado = false;

            if (aleatorioActivo) {
                reproducirAleatorio();
            } else {
                indiceActual = (indiceActual + 1) % archivos.length;
                reproducirArchivo(indiceActual);
            }
        });

        function reproducirAleatorio() {
            if (archivos.length === 0) return;

            let nuevoIndice;

            do {
                nuevoIndice = Math.floor(Math.random() * archivos.length);
            } while (archivos.length > 1 && nuevoIndice === indiceActual);

            indiceActual = nuevoIndice;
            reproducirArchivo(indiceActual);
        }

        function reproducirArchivo(indice, guardarHistorial = true) {
            const archivo = archivos[indice];
            const reader = new FileReader();

            reader.onload = (e) => {
                audio.src = e.target.result;
                audio.play();
                tituloAudio.textContent = archivo.name;
            };

            reader.readAsDataURL(archivo);

            if (guardarHistorial) {
                historial = historial.slice(0, historialIndex + 1);
                historial.push(indice);
                historialIndex++;
            }
        }

        audio.addEventListener('ended', () => {
            retrocesoUsado = false;

            if (aleatorioActivo) {
                reproducirAleatorio();
            } else {
                indiceActual = (indiceActual + 1) % archivos.length;
                reproducirArchivo(indiceActual);
            }
        });
    </script>
</body>

</html>
